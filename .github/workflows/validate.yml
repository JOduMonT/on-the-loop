name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install skills-ref (pinned commit of agentskills/agentskills)
        run: pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Skill passes the Agent Skills validator
        run: skills-ref validate skills/charter

      - name: No symlinks (they break on Windows checkouts)
        run: |
          if git ls-files -s | awk '$1=="120000"' | grep -q .; then
            echo "Symlinks found:"; git ls-files -s | awk '$1=="120000" {print $4}'; exit 1
          fi

      - name: No CRLF in the skill (hash pins must stay stable)
        run: |
          if grep -rIl $'\r' skills evals AGENTS.md README.md; then
            echo "CRLF line endings found in the files above"; exit 1
          fi

      - name: SKILL.md stays under 500 lines
        run: |
          n=$(wc -l < skills/charter/SKILL.md)
          echo "SKILL.md: $n lines"
          [ "$n" -lt 500 ]

      - name: No mind-technique vocabulary or claims in the skill
        run: |
          if grep -rniE "hypno|trance|unconscious|subconscious|affirm|convincer" skills; then
            echo "Forbidden vocabulary found in skills/ (see above)"; exit 1
          fi

      - name: Charter stays at or under 120 lines
        run: |
          n=$(wc -l < skills/charter/references/charter.md)
          echo "charter.md: $n lines"
          [ "$n" -le 120 ]

      - name: Operating core is identical in AGENTS.md and README
        run: |
          python3 - <<'PY'
          import re
          asset = open("skills/charter/assets/operating-core.md").read().strip()
          agents = open("AGENTS.md").read()
          m = re.search(r"## Operating core.*?\n(?=\n## |\Z)", agents, re.S)
          assert m and m.group(0).strip() == asset, "AGENTS.md core differs from the asset"
          readme = open("README.md").read()
          m = re.search(r"<!-- core:begin -->\n```markdown\n(.*?)\n```\n<!-- core:end -->", readme, re.S)
          assert m and m.group(1).strip() == asset, "README core differs from the asset"
          print("core identical in AGENTS.md and README")
          PY

      - name: Evaluation queries are well-formed (20 total, 10 positive, 12 train)
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("evals/trigger-queries.json"))
          assert len(d) == 20, len(d)
          assert sum(x["should_trigger"] for x in d) == 10
          assert sum(x["set"] == "train" for x in d) == 12
          print("evals OK")
          PY

      - name: No traces of private projects (optional)
        env:
          DENYLIST: ${{ vars.DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "DENYLIST repository variable not set; skipping."; exit 0
          fi
          if git grep -nIiE "$DENYLIST" -- . ':!.github'; then
            echo "Forbidden terms found (see above)"; exit 1
          fi
